<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTER-7 — SECURE ACCESS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #000;
            color: #FFD700;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ═══════════════════════════════════════════════════════
           🌊 الخلفية المرعبة — موجات ذهبية تتحرك
           ═══════════════════════════════════════════════════════ */
        .bg-waves {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: -5;
            overflow: hidden;
            background: #000;
        }

        .bg-waves .wave {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center,
                rgba(255, 215, 0, 0.15) 0%,
                rgba(180, 120, 0, 0.1) 20%,
                rgba(80, 40, 0, 0.08) 40%,
                transparent 60%);
            animation: wavePulse 8s ease-in-out infinite;
        }

        .bg-waves .wave:nth-child(2) {
            background: radial-gradient(ellipse at 30% 70%,
                rgba(255, 180, 0, 0.12) 0%,
                rgba(120, 60, 0, 0.08) 30%,
                transparent 55%);
            animation: wavePulse2 12s ease-in-out infinite;
        }

        .bg-waves .wave:nth-child(3) {
            background: radial-gradient(ellipse at 70% 40%,
                rgba(255, 100, 0, 0.08) 0%,
                rgba(180, 60, 0, 0.06) 35%,
                transparent 60%);
            animation: wavePulse3 15s ease-in-out infinite;
        }

        @keyframes wavePulse {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-5%, -10%) scale(1.2);
                opacity: 1;
            }
        }

        @keyframes wavePulse2 {
            0%, 100% {
                transform: translate(0, 0) scale(1.1);
                opacity: 0.5;
            }
            50% {
                transform: translate(8%, -15%) scale(1.3);
                opacity: 0.9;
            }
        }

        @keyframes wavePulse3 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translate(-10%, -20%) scale(1.15);
                opacity: 0.8;
            }
        }

        /* ═══════════════════════════════════════════════════════
           ✨ جسيمات ذهبية طافية
           ═══════════════════════════════════════════════════════ */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            pointer-events: none;
            overflow: hidden;
        }

        .particles span {
            position: absolute;
            bottom: -20px;
            width: 3px;
            height: 3px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 8px #FFD700, 0 0 16px #FFD700;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            50% {
                transform: translateY(-50vh) translateX(20px) scale(1);
                opacity: 1;
            }
            90% { opacity: 0.9; }
            100% {
                transform: translateY(-110vh) translateX(-20px) scale(0.5);
                opacity: 0;
            }
        }

        /* ═══════════════════════════════════════════════════════
           📦 الصندوق الرئيسي
           ═══════════════════════════════════════════════════════ */
        .login-box {
            position: relative;
            z-index: 10;
            background: rgba(10, 8, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 30px;
            width: 380px;
            max-width: 90%;
            border: 2px solid #FFD700;
            box-shadow:
                0 0 40px rgba(255, 215, 0, 0.5),
                0 0 80px rgba(255, 180, 0, 0.3),
                inset 0 0 40px rgba(255, 215, 0, 0.05);
            animation: boxGlow 3s ease-in-out infinite alternate;
        }

        @keyframes boxGlow {
            0% {
                box-shadow:
                    0 0 30px rgba(255, 215, 0, 0.4),
                    0 0 60px rgba(255, 180, 0, 0.25),
                    inset 0 0 30px rgba(255, 215, 0, 0.03);
                border-color: rgba(255, 215, 0, 0.7);
            }
            100% {
                box-shadow:
                    0 0 60px rgba(255, 215, 0, 0.8),
                    0 0 120px rgba(255, 180, 0, 0.5),
                    inset 0 0 60px rgba(255, 215, 0, 0.1);
                border-color: #FFD700;
            }
        }

        /* ═══════════════════════════════════════════════════════
           🎯 العنوان
           ═══════════════════════════════════════════════════════ */
        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 34px;
            letter-spacing: 5px;
            color: #FFD700;
            text-shadow:
                0 0 10px #FFD700,
                0 0 20px #FFD700,
                0 0 40px rgba(255, 180, 0, 0.7),
                0 0 80px rgba(255, 180, 0, 0.4);
            animation: titlePulse 2.5s ease-in-out infinite alternate;
            font-weight: 900;
        }

        @keyframes titlePulse {
            0% {
                text-shadow:
                    0 0 8px #FFD700,
                    0 0 16px #FFD700,
                    0 0 30px rgba(255, 180, 0, 0.6),
                    0 0 60px rgba(255, 180, 0, 0.3);
            }
            100% {
                text-shadow:
                    0 0 15px #FFD700,
                    0 0 30px #FFD700,
                    0 0 60px rgba(255, 180, 0, 0.9),
                    0 0 100px rgba(255, 180, 0, 0.5);
            }
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .welcome {
            text-align: center;
            color: #FFD700;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 25px;
            padding: 10px;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            letter-spacing: 2px;
            animation: welcomeWave 3s ease-in-out infinite;
        }

        @keyframes welcomeWave {
            0%, 100% {
                opacity: 0.85;
                letter-spacing: 2px;
            }
            50% {
                opacity: 1;
                letter-spacing: 3px;
            }
        }

        /* ═══════════════════════════════════════════════════════
           🔐 النموذج
           ═══════════════════════════════════════════════════════ */
        .input-group { margin-bottom: 20px; }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(20, 15, 0, 0.9);
            border: 1.5px solid rgba(255, 215, 0, 0.4);
            border-radius: 12px;
            color: #FFD700;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            transition: all 0.3s;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.1);
            font-family: inherit;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow:
                inset 0 0 20px rgba(255, 215, 0, 0.2),
                0 0 25px rgba(255, 215, 0, 0.6);
            background: rgba(30, 20, 0, 0.95);
        }

        input[type="password"]::placeholder {
            color: #665500;
            letter-spacing: normal;
            text-align: center;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #B8860B, #FFD700, #B8860B);
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 4px;
            transition: all 0.3s;
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 180, 0, 0.4);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            font-family: inherit;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #FFD700, #FFC107, #FFD700);
            box-shadow:
                0 0 30px rgba(255, 215, 0, 0.9),
                0 0 60px rgba(255, 180, 0, 0.6);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ═══════════════════════════════════════════════════════
           ⚠️ الأخطاء
           ═══════════════════════════════════════════════════════ */
        .error {
            background: rgba(255, 0, 60, 0.15);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 0, 60, 0.4);
            display: none;
            font-size: 13px;
            animation: errorShake 0.5s;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ═══════════════════════════════════════════════════════
           👤 معلومات المطور
           ═══════════════════════════════════════════════════════ */
        .dev-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.25);
            text-align: center;
            font-size: 12px;
            color: #888;
            line-height: 1.8;
        }

        .dev-info .dev-name {
            color: #FFD700;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            margin-bottom: 5px;
        }

        .dev-info .dev-label {
            color: #666;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .telegram-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 8px 18px;
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.2), rgba(0, 100, 180, 0.15));
            border: 1px solid #0088cc;
            border-radius: 25px;
            color: #33aaff;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 0 12px rgba(0, 136, 204, 0.3);
        }

        .telegram-link:hover {
            background: linear-gradient(135deg, #0088cc, #006699);
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 136, 204, 0.8);
            transform: translateY(-2px);
        }

        .telegram-link:active {
            transform: translateY(0) scale(0.97);
        }

        .telegram-link .tg-icon {
            font-size: 16px;
        }

        /* ═══════════════════════════════════════════════════════
           📱 للهواتف
           ═══════════════════════════════════════════════════════ */
        @media (max-width: 480px) {
            .login-box {
                width: 92%;
                padding: 35px 22px;
                border-radius: 25px;
            }
            h1 { font-size: 28px; letter-spacing: 4px; }
            .welcome { font-size: 15px; }
            .subtitle { font-size: 10px; }
        }
    </style>
</head>
<body>

    <!-- 🌊 موجات الخلفية -->
    <div class="bg-waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <!-- ✨ الجسيمات الذهبية -->
    <div class="particles" id="particles"></div>

    <!-- 📦 الصندوق -->
    <div class="login-box">
        <h1>SPECTER-7</h1>
        <div class="subtitle">SECURE ACCESS</div>
        <div class="welcome">✨ مرحباً بكم ✨</div>

        <div class="error" id="errorMsg">كلمة المرور غير صحيحة</div>

        <form id="loginForm">
            <div class="input-group">
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required autofocus>
            </div>
            <button type="submit">دخول</button>
        </form>

        <!-- 👤 معلومات المطور -->
        <div class="dev-info">
            <div class="dev-label">DEVELOPED BY</div>
            <div class="dev-name">⚡ DARK: YM ⚡</div>

            <a href="https://t.me/androprH" target="_blank" class="telegram-link">
                <span class="tg-icon">📩</span>
                <span>@androprH — للتواصل</span>
            </a>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════
        // ✨ توليد الجسيمات الذهبية
        // ═══════════════════════════════════════════════════════
        (function makeParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('span');
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.animationDuration = (8 + Math.random() * 10) + 's';
                const size = 1 + Math.random() * 3;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                if (Math.random() > 0.7) {
                    p.style.background = '#FFB300';
                    p.style.boxShadow = '0 0 10px #FFB300, 0 0 20px #FFB300';
                } else if (Math.random() > 0.5) {
                    p.style.background = '#FFC107';
                    p.style.boxShadow = '0 0 8px #FFC107, 0 0 16px #FFC107';
                }
                container.appendChild(p);
            }
        })();

        // ═══════════════════════════════════════════════════════
        // 🔐 بصمة الجهاز
        // ═══════════════════════════════════════════════════════
        function getDeviceFingerprint() {
            let fp = localStorage.getItem('device_fp');
            if (!fp) {
                fp = 'fp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 15);
                localStorage.setItem('device_fp', fp);
            }
            return fp;
        }

        function getDeviceInfo() {
            return {
                fp: getDeviceFingerprint(),
                ua: navigator.userAgent,
                screen: screen.width + 'x' + screen.height,
                lang: navigator.language,
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
        }

        function showMessage(msg, type) {
            const err = document.getElementById('errorMsg');
            err.textContent = msg;
            err.style.display = 'block';
            err.style.animation = 'none';
            if (type === 'pending') {
                err.style.background = 'rgba(255, 200, 0, 0.15)';
                err.style.color = '#ffcc00';
                err.style.borderColor = 'rgba(255, 200, 0, 0.4)';
            } else if (type === 'denied') {
                err.style.background = 'rgba(255, 0, 60, 0.15)';
                err.style.color = '#ff6b6b';
                err.style.borderColor = 'rgba(255, 0, 60, 0.4)';
            } else {
                err.style.background = 'rgba(255, 0, 60, 0.15)';
                err.style.color = '#ff6b6b';
                err.style.borderColor = 'rgba(255, 0, 60, 0.4)';
            }
            setTimeout(() => { err.style.animation = 'errorShake 0.5s'; }, 10);
        }

        // ═══════════════════════════════════════════════════════
        // 🔓 تسجيل الدخول
        // ═══════════════════════════════════════════════════════
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const deviceInfo = getDeviceInfo();
            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = '...';
            btn.disabled = true;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, device: deviceInfo })
                });
                const data = await res.json();

                if (data.status === 'approved') {
                    sessionStorage.setItem('logged_in', 'true');
                    sessionStorage.setItem('auth_token', data.token);
                    sessionStorage.setItem('is_owner', data.isOwner ? 'true' : 'false');
                    window.location.href = 'index.html';
                    return;
                }

                if (data.status === 'pending') {
                    showMessage('⏳ جهازك بانتظار موافقة المالك', 'pending');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    return;
                }

                if (data.status === 'denied') {
                    showMessage('🚫 تم رفض جهازك من المالك', 'denied');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    return;
                }

                showMessage('❌ كلمة المرور غير صحيحة', 'error');
                btn.textContent = originalText;
                btn.disabled = false;

            } catch (err) {
                showMessage('❌ خطأ في الاتصال بالسيرفر', 'error');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // ═══════════════════════════════════════════════════════
        // ✅ فحص الجلسة الموجودة
        // ═══════════════════════════════════════════════════════
        (async function checkExisting() {
            const token = sessionStorage.getItem('auth_token');
            if (!token) return;

            try {
                const res = await fetch('/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                if (data.valid) {
                    sessionStorage.setItem('is_owner', data.isOwner ? 'true' : 'false');
                    window.location.href = 'index.html';
                } else {
                    sessionStorage.removeItem('logged_in');
                    sessionStorage.removeItem('auth_token');
                    sessionStorage.removeItem('is_owner');
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
