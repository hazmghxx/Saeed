<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - SPECTER-7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #000;
            color: #fff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(139, 0, 0, 0.55), transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(75, 0, 130, 0.55), transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 60, 80, 0.45), transparent 60%),
                #000;
            animation: bgShift 18s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%;
            height: 200%;
            z-index: -2;
            background:
                repeating-linear-gradient(45deg,
                    transparent 0px,
                    transparent 40px,
                    rgba(255, 0, 60, 0.04) 40px,
                    rgba(255, 0, 60, 0.04) 80px),
                repeating-linear-gradient(-45deg,
                    transparent 0px,
                    transparent 60px,
                    rgba(0, 200, 255, 0.04) 60px,
                    rgba(0, 200, 255, 0.04) 120px);
            animation: waveMove 30s linear infinite;
        }

        @keyframes bgShift {
            0% {
                background-position: 0% 0%, 100% 100%, 50% 50%;
                filter: hue-rotate(0deg);
            }
            50% { filter: hue-rotate(20deg); }
            100% {
                background-position: 100% 100%, 0% 0%, 50% 50%;
                filter: hue-rotate(-20deg);
            }
        }

        @keyframes waveMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(2deg); }
        }

        .login-box {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 45px 40px;
            border-radius: 15px;
            width: 360px;
            max-width: 90%;
            border: 1px solid rgba(255, 0, 60, 0.4);
            box-shadow:
                0 0 40px rgba(255, 0, 60, 0.35),
                0 0 80px rgba(139, 0, 0, 0.25),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            animation: boxPulse 4s ease-in-out infinite;
        }

        @keyframes boxPulse {
            0%, 100% {
                box-shadow:
                    0 0 40px rgba(255, 0, 60, 0.35),
                    0 0 80px rgba(139, 0, 0, 0.25),
                    inset 0 0 30px rgba(0, 0, 0, 0.5);
            }
            50% {
                box-shadow:
                    0 0 60px rgba(255, 0, 60, 0.55),
                    0 0 120px rgba(139, 0, 0, 0.4),
                    inset 0 0 40px rgba(0, 0, 0, 0.6);
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            letter-spacing: 4px;
            color: #ff003c;
            text-shadow:
                0 0 10px #ff003c,
                0 0 20px #ff003c,
                0 0 40px #8b0000,
                0 0 80px #8b0000;
            animation: titleFlicker 3s infinite;
        }

        @keyframes titleFlicker {
            0%, 100% { opacity: 1; }
            45% { opacity: 1; }
            47% { opacity: 0.6; }
            49% { opacity: 1; }
            92% { opacity: 1; }
            94% { opacity: 0.4; }
            96% { opacity: 1; }
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 25px;
            margin-top: -20px;
        }

        .input-group { margin-bottom: 25px; }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(20, 0, 30, 0.8);
            border: 1.5px solid #4b0082;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            transition: all 0.3s;
            box-shadow: inset 0 0 15px rgba(75, 0, 130, 0.4);
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #ff003c;
            box-shadow:
                inset 0 0 20px rgba(255, 0, 60, 0.3),
                0 0 25px rgba(255, 0, 60, 0.6);
            background: rgba(30, 0, 40, 0.9);
        }

        input[type="password"]::placeholder {
            color: #555;
            letter-spacing: normal;
            text-align: center;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b0000, #ff003c);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
            transition: all 0.3s;
            box-shadow:
                0 0 20px rgba(255, 0, 60, 0.6),
                0 0 40px rgba(139, 0, 0, 0.4);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 30px rgba(255, 0, 60, 0.9),
                0 0 60px rgba(139, 0, 0, 0.6);
            background: linear-gradient(135deg, #ff003c, #8b0000);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: rgba(255, 0, 60, 0.15);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 0, 60, 0.4);
            display: none;
            animation: errorShake 0.5s;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .particles {
            position: fixed;
            top: 25%;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .particles span {
            position: absolute;
            bottom: 0;
            width: 3px;
            height: 3px;
            background: #ff003c;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c;
            animation: floatDrift 10s linear infinite;
            opacity: 0;
        }

        @keyframes floatDrift {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0;
            }
            20% { opacity: 0.7; }
            50% {
                transform: translate(30px, 0) scale(1);
                opacity: 0.9;
            }
            80% { opacity: 0.7; }
            100% {
                transform: translate(-30px, 0) scale(0.5);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                width: 90%;
                padding: 35px 25px;
            }
            h1 { font-size: 26px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="login-box">
        <h1>SPECTER-7</h1>
        <div class="subtitle">SECURE ACCESS</div>

        <div class="error" id="errorMsg">كلمة المرور غير صحيحة</div>

        <form id="loginForm">
            <div class="input-group">
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required autofocus>
            </div>
            <button type="submit">دخول</button>
        </form>
    </div>

    <script>
        (function makeParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('span');
                p.style.left = Math.random() * 100 + '%';
                p.style.bottom = (Math.random() * 60) + '%';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.animationDuration = (6 + Math.random() * 8) + 's';
                if (Math.random() > 0.6) {
                    p.style.background = '#4b0082';
                    p.style.boxShadow = '0 0 10px #4b0082, 0 0 20px #4b0082';
                }
                container.appendChild(p);
            }
        })();

        // ═══════════════════════════════════════════════════════
        // 🔐 DEVICE FINGERPRINT
        // ═══════════════════════════════════════════════════════
        function getDeviceFingerprint() {
            let fp = localStorage.getItem('device_fp');
            if (!fp) {
                fp = 'fp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 15);
                localStorage.setItem('device_fp', fp);
            }
            return fp;
        }

        function getDeviceInfo() {
            return {
                fp: getDeviceFingerprint(),
                ua: navigator.userAgent,
                screen: screen.width + 'x' + screen.height,
                lang: navigator.language,
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
        }

        function showMessage(msg, type) {
            const err = document.getElementById('errorMsg');
            err.textContent = msg;
            err.style.display = 'block';
            err.style.animation = 'none';
            if (type === 'pending') {
                err.style.background = 'rgba(255, 200, 0, 0.15)';
                err.style.color = '#ffcc00';
                err.style.borderColor = 'rgba(255, 200, 0, 0.4)';
            } else if (type === 'denied') {
                err.style.background = 'rgba(255, 0, 60, 0.15)';
                err.style.color = '#ff6b6b';
                err.style.borderColor = 'rgba(255, 0, 60, 0.4)';
            } else {
                err.style.background = 'rgba(255, 0, 60, 0.15)';
                err.style.color = '#ff6b6b';
                err.style.borderColor = 'rgba(255, 0, 60, 0.4)';
            }
            setTimeout(() => { err.style.animation = 'errorShake 0.5s'; }, 10);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const deviceInfo = getDeviceInfo();
            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = '...';
            btn.disabled = true;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, device: deviceInfo })
                });
                const data = await res.json();

                if (data.status === 'approved') {
                    sessionStorage.setItem('logged_in', 'true');
                    sessionStorage.setItem('auth_token', data.token);
                    sessionStorage.setItem('is_owner', data.isOwner ? 'true' : 'false');
                    window.location.href = 'index.html';
                    return;
                }

                if (data.status === 'pending') {
                    showMessage('⏳ جهازك بانتظار موافقة المالك', 'pending');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    return;
                }

                if (data.status === 'denied') {
                    showMessage('🚫 تم رفض جهازك من المالك', 'denied');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    return;
                }

                showMessage('❌ كلمة المرور غير صحيحة', 'error');
                btn.textContent = originalText;
                btn.disabled = false;

            } catch (err) {
                showMessage('❌ خطأ في الاتصال بالسيرفر', 'error');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        (async function checkExisting() {
            const token = sessionStorage.getItem('auth_token');
            if (!token) return;

            try {
                const res = await fetch('/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                if (data.valid) {
                    sessionStorage.setItem('is_owner', data.isOwner ? 'true' : 'false');
                    window.location.href = 'index.html';
                } else {
                    sessionStorage.removeItem('logged_in');
                    sessionStorage.removeItem('auth_token');
                    sessionStorage.removeItem('is_owner');
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
